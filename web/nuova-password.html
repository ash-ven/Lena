<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0D10">
<meta name="referrer" content="no-referrer">
<title>Nuova password · Lena</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icone-app/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lena">
<script src="/tema.js"></script>
<link rel="stylesheet" href="/sistema.css">
<link rel="stylesheet" href="/pagine.css">
</head>
<body class="semplice">
<div class="angolo" data-tema-controllo></div>
<main class="pagina">
  <div class="riquadro">
    <p class="logo"><a href="/" aria-label="Lena, torna alla home"><img class="logo-img su-scuro" src="/logo/lena-logo-scuro.svg" alt="Lena" width="152" height="32"><img class="logo-img su-chiaro" src="/logo/lena-logo-chiaro.svg" alt="Lena" width="152" height="32"></a></p>
    <h1>Scegli una nuova password.</h1>
    <p class="testo-tenue" id="introduzione">Dopo il cambio dovrai accedere di nuovo con la nuova password.</p>
    <div id="messaggio" class="messaggio errore" role="alert" hidden></div>

    <form id="modulo" novalidate>
      <div class="campo-modulo">
        <label for="password">Nuova password</label>
        <input id="password" name="password" type="password" autocomplete="new-password"
               aria-describedby="aiuto-password" required>
        <span class="aiuto" id="aiuto-password">Almeno 10 caratteri. Va bene anche una frase facile da ricordare.</span>
      </div>
      <label class="mostra"><input type="checkbox" id="mostra"><span>Mostra la password</span></label>
      <button class="pulsante" type="submit" id="invia">Cambia password</button>
    </form>

    <p class="sotto"><a href="/login.html">Torna al login</a></p>
  </div>
</main>
<footer class="piede-legale"><a href="/privacy.html">Informativa privacy</a></footer>
<noscript><p class="centrato">Per usare Lena serve JavaScript attivo nel browser.</p></noscript>
<script src="/api.js"></script>
<script src="/pwa.js"></script>
<script src="/nuova-password.js"></script>
</body>
</html>
