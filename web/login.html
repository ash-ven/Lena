<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0D10">
<title>Accedi · Lena</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icone-app/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lena">
<script src="/tema.js"></script>
<link rel="stylesheet" href="/sistema.css">
<link rel="stylesheet" href="/pagine.css">
</head>
<body class="semplice">
<div class="angolo" data-tema-controllo></div>
<main class="pagina">
  <div class="riquadro">
    <p class="logo"><img class="logo-img su-scuro" src="/logo/lena-logo-scuro.svg" alt="Lena" width="152" height="32"><img class="logo-img su-chiaro" src="/logo/lena-logo-chiaro.svg" alt="Lena" width="152" height="32"></p>
    <h1 id="titolo-login">Il prossimo allenamento ti aspetta.</h1>
    <p class="testo-tenue" id="testo-login">Entra per vedere la tua scheda.</p>

    <div id="messaggio" class="messaggio errore" role="alert" hidden></div>

    <form id="modulo" novalidate>
      <div class="campo-modulo">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" inputmode="email"
               autocapitalize="none" spellcheck="false" required>
      </div>
      <div class="campo-modulo">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <label class="mostra"><input type="checkbox" id="mostra"><span>Mostra la password</span></label>
      <button class="pulsante" type="submit" id="invia">Accedi</button>
    </form>

    <p class="sotto"><a href="/password-dimenticata.html">Hai dimenticato la password?</a></p>
    <p class="sotto" id="sotto-login">Non hai un account? Chiedi l'invito al tuo trainer.</p>
    <p class="sotto"><a id="cambia" href="/" hidden>Cambia tipo di accesso</a></p>
  </div>
</main>
<footer class="piede-legale"><a href="/privacy.html">Informativa privacy</a></footer>
<noscript><p class="centrato">Per usare Lena serve JavaScript attivo nel browser.</p></noscript>
<script src="/api.js"></script>
<script src="/pwa.js"></script>
<script src="/login.js"></script>
</body>
</html>
