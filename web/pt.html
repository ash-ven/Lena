<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0D10">
<title>Clienti · Lena</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script src="/tema.js"></script>
<link rel="stylesheet" href="/sistema.css">
<link rel="stylesheet" href="/pt.css">
</head>
<body class="pt">
<header class="barra-pt">
  <div class="dentro">
    <div><a class="logo-pt" href="/pt.html">Lena</a><span class="area-pt">Area trainer</span></div>
    <div class="destra">
      <a class="bottone secondario piccolo" href="/pt-profilo.html"><span class="icona i-utente" aria-hidden="true"></span>Profilo</a>
      <div data-tema-controllo></div>
      <button class="bottone secondario piccolo" type="button" id="esci"><span class="icona i-esci" aria-hidden="true"></span>Esci</button>
    </div>
  </div>
</header>

<main class="contenitore" id="contenuto">
  <div class="intestazione-pagina">
    <div>
      <h1 class="titolo">Clienti</h1>
      <p class="sotto-titolo">Carica le schede e invita i tuoi clienti a vederle.</p>
    </div>
    <button class="bottone" type="button" id="apri-nuovo" aria-expanded="false" aria-controls="modulo-nuovo"><span class="icona i-piu" aria-hidden="true"></span>Nuovo cliente</button>
  </div>

  <div id="messaggio-pagina" role="status"></div>

  <form class="pannello" id="modulo-nuovo" novalidate hidden aria-labelledby="titolo-nuovo">
    <h2 class="sezione-pt" id="titolo-nuovo">Nuovo cliente</h2>
    <div class="riga-campi">
      <div class="campo-pt">
        <label for="nuovo-nome">Nome</label>
        <input id="nuovo-nome" type="text" autocomplete="off" maxlength="100" required>
      </div>
      <div class="campo-pt">
        <label for="nuovo-cognome">Cognome</label>
        <input id="nuovo-cognome" type="text" autocomplete="off" maxlength="100" required>
      </div>
    </div>
    <div id="errore-nuovo" role="alert"></div>
    <div class="azioni-pt">
      <button class="bottone" type="submit" id="crea-cliente">Crea cliente</button>
      <button class="bottone secondario" type="button" id="annulla-nuovo">Annulla</button>
    </div>
  </form>

  <ul class="riepilogo" id="riepilogo" aria-label="Riepilogo dei clienti" hidden></ul>

  <section aria-labelledby="titolo-elenco">
    <h2 class="sezione-pt" id="titolo-elenco">Elenco</h2>
    <div class="campo-pt">
      <label for="cerca">Cerca un cliente</label>
      <input id="cerca" type="search" autocomplete="off" placeholder="Nome o cognome">
    </div>
    <p class="conteggio" id="conteggio" role="status"></p>
    <div id="stato-elenco" aria-live="polite"></div>
    <ul class="elenco-clienti" id="elenco"></ul>
  </section>
</main>
<footer class="piede-legale"><a href="/privacy.html">Informativa privacy</a> · <a href="/condizioni-pt.html">Condizioni d'uso per i professionisti</a></footer>
<noscript><p>Per usare Lena serve JavaScript attivo nel browser.</p></noscript>
<script src="/api.js"></script>
<script src="/pt-comune.js"></script>
<script src="/pt.js"></script>
</body>
</html>
