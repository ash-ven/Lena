<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0D10">
<meta name="referrer" content="no-referrer">
<title>Crea il tuo accesso · Lena</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script src="/tema.js"></script>
<link rel="stylesheet" href="/sistema.css">
<link rel="stylesheet" href="/pagine.css">
</head>
<body class="semplice">
<div class="angolo" data-tema-controllo></div>
<main class="pagina con-lato">
  <aside class="lato-brace" aria-hidden="true">
    <svg class="gradi-lato" viewBox="-4 44 188 96" focusable="false"><path class="gr su r3" d="M0 120 L24 104 L48 120"/><path class="gr su r2" d="M0 96 L24 80 L48 96"/><path class="gr su r1" d="M0 72 L24 56 L48 72"/><path class="gr su r3" d="M64 120 L88 104 L112 120"/><path class="gr su r2" d="M64 96 L88 80 L112 96"/><path class="gr su r1" d="M64 72 L88 56 L112 72"/><path class="gr su r3" d="M128 120 L152 104 L176 120"/><path class="gr su r2" d="M128 96 L152 80 L176 96"/><path class="gr su r1" d="M128 72 L152 56 L176 72"/></svg>
    <p>Gli allenamenti, in ordine.</p>
  </aside>
  <div class="riquadro">
    <p class="logo"><img class="logo-img su-scuro" src="/logo/lena-logo-scuro.svg" alt="Lena" width="152" height="32"><img class="logo-img su-chiaro" src="/logo/lena-logo-chiaro.svg" alt="Lena" width="152" height="32"></p>
    <h1>Crea il tuo accesso.</h1>
    <p class="testo-tenue" id="introduzione">Il tuo trainer ti ha invitato. Scegli email e password per vedere la tua scheda.</p>

    <div id="messaggio" class="messaggio errore" role="alert" hidden></div>

    <form id="modulo" novalidate>
      <div class="campo-modulo">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" inputmode="email"
               autocapitalize="none" spellcheck="false" required>
      </div>
      <div class="campo-modulo">
        <label for="password">Scegli una password</label>
        <input id="password" name="password" type="password" autocomplete="new-password"
               aria-describedby="aiuto-password" required>
        <span class="aiuto" id="aiuto-password">Almeno 10 caratteri. Va bene anche una frase facile da ricordare.</span>
      </div>
      <label class="mostra"><input type="checkbox" id="mostra"><span>Mostra la password</span></label>
      <label class="mostra"><input type="checkbox" id="accetta"><span>Ho letto <a href="/privacy.html" target="_blank" rel="noopener">l'informativa privacy</a> (versione <span id="versione-informativa">…</span>)</span></label>
      <button class="pulsante" type="submit" id="invia">Crea accesso</button>
    </form>

    <p class="sotto">Hai già un account? <a href="/login.html">Accedi</a></p>
  </div>
</main>
<footer class="piede-legale"><a href="/privacy.html">Informativa privacy</a></footer>
<noscript><p class="centrato">Per usare Lena serve JavaScript attivo nel browser.</p></noscript>
<script src="/api.js"></script>
<script src="/registrati.js"></script>
</body>
</html>
