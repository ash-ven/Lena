<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0D10">
<title>Crea scheda · Lena</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script src="/tema.js"></script>
<link rel="stylesheet" href="/sistema.css">
<link rel="stylesheet" href="/pt.css">
</head>
<body class="pt">
<header class="barra-pt">
  <div class="dentro">
    <div><a class="logo-pt" href="/pt.html"><img class="logo-img su-scuro" src="/logo/lena-logo-scuro.svg" alt="Lena" width="124" height="26"><img class="logo-img su-chiaro" src="/logo/lena-logo-chiaro.svg" alt="Lena" width="124" height="26"></a><span class="area-pt">Area trainer</span></div>
    <div class="destra">
      <a class="bottone secondario piccolo" href="/pt-profilo.html"><span class="icona i-utente" aria-hidden="true"></span><span class="testo-largo">Profilo</span></a>
      <div data-tema-controllo></div>
      <button class="bottone secondario piccolo" type="button" id="esci"><span class="icona i-esci" aria-hidden="true"></span>Esci</button>
    </div>
  </div>
</header>

<main class="contenitore" id="contenuto">
  <a class="indietro" id="indietro" href="/pt.html"><span class="icona i-indietro" aria-hidden="true"></span>Torna al cliente</a>
  <div id="stato-pagina" aria-live="polite"></div>

  <div id="pagina" hidden>
    <div class="testata-pt">
      <div>
        <div class="testata-titolo">
          <h1 class="titolo">Nuova scheda</h1>
          <svg class="gradi-testata" viewBox="0 0 56 56" aria-hidden="true" focusable="false"><path d="M8 18 L28 4 L48 18"/><path d="M8 32 L28 18 L48 32"/><path d="M8 46 L28 32 L48 46"/></svg>
        </div>
        <p class="sotto-titolo">Per <strong id="nome-cliente"></strong>. Quello che scrivi si salva da solo su questo dispositivo finché non invii la scheda.</p>
      </div>
    </div>
    <div id="bozza-avviso"></div>

    <datalist id="suggerimenti"></datalist>
    <div id="editor"></div>

    <section class="pannello" aria-labelledby="t-invio">
      <h2 class="sezione-pt" id="t-invio">Controlla e invia</h2>
      <div id="ed-messaggi" role="alert" aria-live="assertive"></div>
      <div id="ed-conferma" hidden>
        <label class="spunta-pt"><input type="checkbox" id="ed-ok"><span>Ho letto gli avvisi e voglio inviare lo stesso</span></label>
      </div>
      <div class="azioni-pt">
        <button class="bottone" type="button" id="ed-invia">Invia al cliente</button>
        <button class="bottone secondario" type="button" id="ed-anteprima">Guarda l'anteprima</button>
      </div>
      <div id="ed-telefono" class="telefono-pt" hidden></div>
    </section>
  </div>
</main>
<footer class="piede-legale"><a href="/privacy.html">Informativa privacy</a> · <a href="/condizioni-pt.html">Condizioni d'uso per i professionisti</a></footer>
<noscript><p>Per usare Lena serve JavaScript attivo nel browser.</p></noscript>
<script src="/api.js"></script>
<script src="/valida-scheda.js"></script>
<script src="/da-scheda.js"></script>
<script src="/parole-salute.js"></script>
<script src="/pt-comune.js"></script>
<script src="/pt-editor.js"></script>
</body>
</html>
