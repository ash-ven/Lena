<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lena · Convertitore</title>
<!-- la libreria per leggere l'Excel e la logica del convertitore stanno nel progetto: nessun CDN, nessuna richiesta a terzi -->
<script src="web/vendor/xlsx.full.min.js"></script>
<script src="web/parole-salute.js"></script>
<script src="web/convertitore.js"></script>
<style>
  body{margin:0;background:#FBF8F3;color:#3A3A3A;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.45}
  header{padding:22px 24px 0}
  h1{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:32px;margin:0}
  .versione{font-size:12px;color:#8A8580;margin:2px 0 0}
  .layout{display:grid;grid-template-columns:minmax(280px,420px) 1fr;gap:24px;padding:20px 24px 40px;align-items:start}
  @media (max-width:800px){.layout{grid-template-columns:1fr}}
  .card{background:#fff;border:1px solid #E8E2DA;border-radius:18px;padding:16px;margin-bottom:16px}
  .card h2{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:20px;margin:0 0 10px}
  button{font:inherit;cursor:pointer;border-radius:999px;border:1px solid #A86A6B;background:#A86A6B;color:#fff;padding:10px 18px}
  button:disabled{opacity:.35;cursor:default}
  button.secondario{background:transparent;color:#A86A6B}
  .pulsanti{display:flex;flex-wrap:wrap;gap:8px}
  #esito{border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px;background:#FBF8F3;color:#8A8580}
  #esito.ok{background:#E2F1E6;color:#2F6B3F}
  #esito.avvisi{background:#FBEFE3;border:1px solid #EBCBA8;color:#7A5228}
  #esito.errore{background:#F8E1E1;border:1px solid #E3B4B4;color:#7A2E2E}
  #esito ul{margin:6px 0 0;padding-left:20px}
  #esito li{margin-bottom:4px}
  .telefono{width:390px;max-width:100%;height:760px;border:10px solid #3A3A3A;border-radius:36px;overflow:hidden;background:#FBF8F3;margin:0 auto;box-sizing:content-box}
  .telefono iframe{width:100%;height:100%;border:0;display:block}
  .telefono .vuoto{margin:0;padding:40px 24px;text-align:center;color:#8A8580;font-style:italic}
  details.card summary{cursor:pointer;color:#8A8580;font-size:14px}
  textarea{width:100%;margin-top:10px;font-family:ui-monospace,Consolas,monospace;font-size:12px;box-sizing:border-box}
</style>
</head>
<body>
<header>
  <h1>Lena</h1>
  <p class="versione">Convertitore Excel → scheda · Versione 9 · con anteprima</p>
</header>

<div class="layout">
  <div>
    <div class="card">
      <h2>1. Carica l'Excel</h2>
      <input type="file" id="file" accept=".xlsx">
    </div>
    <div class="card">
      <h2>2. Controlla</h2>
      <div id="esito">Scegli un file Excel per cominciare.</div>
      <div class="pulsanti">
        <button id="scarica" disabled>Scarica scheda</button>
        <button id="copia-dati" class="secondario" disabled title="Per caricare la scheda sul sito con node carica-scheda.js">Copia dati (JSON)</button>
        <button id="scarica-dati" class="secondario" disabled title="Un file .json da dare a node carica-scheda.js">Scarica dati (JSON)</button>
      </div>
    </div>
    <details class="card">
      <summary>Dati grezzi (per tecnici)</summary>
      <textarea id="codice" rows="10" readonly></textarea>
    </details>
  </div>
  <div>
    <div class="telefono" id="telefono"><p class="vuoto">L'anteprima della scheda comparirà qui.</p></div>
  </div>
</div>

<script>
// ---------- la pagina ----------
let ultimiDati = null;       // i dati dell'ultimo Excel letto
let paginaCompleta = null;   // la scheda finita (modello + dati): serve all'anteprima e al download

// Il modello della scheda rimanda a file esterni (lo stile e il programma della scheda: sono gli stessi
// che usa il sito). La scheda scaricata però deve essere UN file solo e autonomo, quindi qui li
// incorporiamo dentro la pagina al posto dei riferimenti.
async function leggiTesto(percorso) {
  const r = await fetch(percorso);
  if (!r.ok) throw new Error(percorso + " non trovato");
  return r.text();
}
async function leggiModello() {
  let html = await leggiTesto("modello-scheda.html");
  const riferimenti = [...html.matchAll(/<link rel="stylesheet" href="([^"]+)">|<script src="([^"]+)"><\/script>/g)];
  for (const m of riferimenti) {
    const testo = await leggiTesto(m[1] || m[2]);
    // se il programma contenesse la sequenza che chiude un tag script, la pagina si romperebbe: la rendiamo innocua
    const blocco = m[1]
      ? "<style>\n" + testo + "\n</style>"
      : "<script>\n" + testo.replace(/<\/script/gi, "<\\/script") + "\n<\/script>";
    html = html.replace(m[0], () => blocco);   // la funzione evita che i simboli $ nel testo vengano interpretati
  }
  return html;
}

// il modello (già completo di stile e programma) si legge una volta sola, all'apertura della pagina
const modelloPronto = leggiModello();
modelloPronto.catch(() => {});   // l'errore lo gestiamo più avanti, quando serve

// mette i dati al posto del segnaposto
function costruisciPagina(modello, dati) {
  const json = JSON.stringify(dati).replace(/</g, "\\u003c");
  return modello.replace("/*__DATI__*/ null", () => json);
}

// il riquadro colorato con l'esito del controllo
function mostraEsito(tipo, titolo, elenco) {
  const box = document.getElementById("esito");
  box.className = tipo;
  box.replaceChildren(titolo);
  if (elenco && elenco.length) {
    const ul = document.createElement("ul");
    for (const voce of elenco) {
      const li = document.createElement("li");
      li.textContent = voce;
      ul.append(li);
    }
    box.append(ul);
  }
}

// la cornice del telefono
function mostraAnteprima(html) {
  const tel = document.getElementById("telefono");
  tel.replaceChildren();
  const f = document.createElement("iframe");
  f.name = "lena-anteprima";   // il modello lo riconosce da questo nome
  f.setAttribute("sandbox", "allow-scripts allow-popups allow-popups-to-escape-sandbox");
  f.srcdoc = html;
  tel.append(f);
}
function svuotaAnteprima(messaggio) {
  const p = document.createElement("p");
  p.className = "vuoto";
  p.textContent = messaggio;
  document.getElementById("telefono").replaceChildren(p);
}

document.getElementById("file").addEventListener("change", async (ev) => {
  const file = ev.target.files[0];
  if (!file) return;

  ultimiDati = null;
  paginaCompleta = null;
  document.getElementById("scarica").disabled = true;
  document.getElementById("copia-dati").disabled = true;
  document.getElementById("scarica-dati").disabled = true;
  let avvisi = [];

  try {
    const byte = await file.arrayBuffer();
    const risultato = LenaConvertitore.convertiXlsx(XLSX, byte);
    ultimiDati = risultato.dati;
    avvisi = risultato.avvisi;
  } catch (err) {
    // rete di sicurezza: qualunque errore imprevisto diventa un messaggio leggibile
    avvisi = ["Non riesco a leggere questo file: " + err.message];
  }

  document.getElementById("codice").value = ultimiDati ? JSON.stringify(ultimiDati, null, 1) : "";

  if (!ultimiDati) {
    mostraEsito("errore", "La scheda non si può creare:", avvisi);
    svuotaAnteprima("Nessuna anteprima: correggi l'Excel e riprova.");
  } else {
    try {
      const modello = await modelloPronto;
      paginaCompleta = costruisciPagina(modello, ultimiDati);
      mostraAnteprima(paginaCompleta);
      document.getElementById("scarica").disabled = false;
      document.getElementById("copia-dati").disabled = false;
      document.getElementById("scarica-dati").disabled = false;
      if (avvisi.length) mostraEsito("avvisi", `Scheda pronta, ma ci sono ${avvisi.length} avvisi da controllare:`, avvisi);
      else mostraEsito("ok", "Scheda pronta: nessun avviso.");
    } catch (err) {
      mostraEsito("errore", "Non riesco a leggere il modello della scheda. Apri questa pagina dall'indirizzo http://localhost (comando npx serve .), non con doppio clic.", avvisi);
    }
  }
  ev.target.value = "";
});

// il nome del file, per esempio "asiha-venturi"
function nomeBase() {
  return `${ultimiDati.info.nome}-${ultimiDati.info.cognome}`.toLowerCase().replace(/[^a-z0-9]+/g, "-");
}
const flash = (bottone, testo) => {
  const prima = bottone.textContent;
  bottone.textContent = testo;
  setTimeout(() => { bottone.textContent = prima; }, 2500);
};

// I dati della scheda (quelli che il sito salva nel database), pronti da incollare o da salvare in un file
document.getElementById("copia-dati").addEventListener("click", async (ev) => {
  if (!ultimiDati) return;
  const testo = JSON.stringify(ultimiDati, null, 2);
  try {
    await navigator.clipboard.writeText(testo);
  } catch (err) {
    // se il browser non permette di copiare da qui, si copia dal riquadro «Dati grezzi»
    const area = document.getElementById("codice");
    area.value = testo;
    area.select();
    if (!document.execCommand("copy")) return flash(ev.target, "Non riesco a copiare: usa «Scarica dati»");
  }
  flash(ev.target, "Copiato ✓");
});

document.getElementById("scarica-dati").addEventListener("click", () => {
  if (!ultimiDati) return;
  const blob = new Blob([JSON.stringify(ultimiDati, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `dati-${nomeBase()}.json`;
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});

document.getElementById("scarica").addEventListener("click", () => {
  if (!paginaCompleta) return;
  const nomeFile = `scheda-${ultimiDati.info.nome}-${ultimiDati.info.cognome}`
    .toLowerCase().replace(/[^a-z0-9]+/g, "-") + ".html";
  const blob = new Blob([paginaCompleta], { type: "text/html" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = nomeFile;
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});
</script>
</body>
</html>
